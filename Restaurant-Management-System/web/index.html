<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8fa">
  <title>Bếp Việt • Quản lý nhà hàng</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-logo">✦</div><div><strong>Bếp Việt <span class="brand-tag">POS</span></strong><span>Restaurant Management</span></div></div>
    <div class="nav-group">KHÔNG GIAN LÀM VIỆC</div>
    <nav class="nav" id="nav">
      <button type="button" class="nav-link active" data-route="overview"><span class="glyph">◫</span> Tổng quan</button>
      <button type="button" class="nav-link" data-route="tables"><span class="glyph">▦</span> Quản lý bàn</button>
      <button type="button" class="nav-link" data-route="menu"><span class="glyph">☷</span> Thực đơn</button>
      <button type="button" class="nav-link" data-route="orders"><span class="glyph">▤</span> Đơn hàng</button>
      <button type="button" class="nav-link" data-route="reports"><span class="glyph">▥</span> Báo cáo</button>
    </nav>
    <div class="sidebar-bottom"><div class="hint">Dữ liệu được lưu trên trình duyệt hiện tại.</div><button type="button" id="exportBtn">↓ Sao lưu dữ liệu JSON</button><div class="version" style="margin-top:12px">Bản thử nghiệm • v1.0</div></div>
  </aside>
  <main class="main"><div class="topbar"><div class="breadcrumb" id="breadcrumb">Không gian làm việc / Tổng quan</div><div class="top-actions"><div class="live">Hoạt động trên thiết bị</div><button type="button" class="btn btn-white btn-xs" id="exportTop">↓ Xuất dữ liệu</button></div></div><div id="view"></div></main>
</div>
<div class="overlay" id="modalOverlay"><div class="modal" id="modalContent" role="dialog" aria-modal="true" aria-label="Biểu mẫu"></div></div>
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<section class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Chi tiết đơn hàng"><div id="drawerBody" style="display:contents"></div></section>
<div id="toast" class="toast" role="status"></div>
<div id="receiptPrintable" style="display:none"></div>
<input id="importInput" type="file" accept="application/json,.json" hidden>
<script>
'use strict';
const KEY='bepviet_pos_mvp_2026_v1';
const dateFmt = new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'});
const timeFmt = new Intl.DateTimeFormat('vi-VN',{hour:'2-digit',minute:'2-digit'});
const money = v => new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND',maximumFractionDigits:0}).format(Number(v)||0);
const shortMoney = v => (v>=1000000?(v/1000000).toLocaleString('vi-VN',{maximumFractionDigits:1})+'tr':v>=1000?(v/1000).toLocaleString('vi-VN',{maximumFractionDigits:0})+'k':String(v));
const id = prefix => prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed = () => ({tables:Array.from({length:12},(_,i)=>({id:'table_'+(i+1),name:'Bàn '+String(i+1).padStart(2,'0'),capacity:i%3===0?6:i%3===1?4:2})),menu:[
  ['Phở bò tái','Món chính',65000,'🍜'],['Bún chả Hà Nội','Món chính',65000,'🥢'],['Cơm rang hải sản','Món chính',79000,'🍚'],['Bò lúc lắc','Món chính',119000,'🥩'],['Gà nướng mật ong','Món chính',99000,'🍗'],['Lẩu Thái','Món chính',259000,'🍲'],
  ['Nem rán','Khai vị',49000,'🥟'],['Salad rau củ','Khai vị',45000,'🥗'],['Khoai tây chiên','Khai vị',39000,'🍟'],['Trà đào cam sả','Đồ uống',35000,'🍹'],['Nước chanh','Đồ uống',25000,'🍋'],['Cà phê sữa','Đồ uống',30000,'☕'],['Sữa chua nếp cẩm','Tráng miệng',35000,'🍨'],['Bánh flan','Tráng miệng',29000,'🍮']
].map((m,i)=>({id:'dish_'+(i+1),name:m[0],category:m[1],price:m[2],emoji:m[3],available:true})),orders:[]});
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return seed();const data=JSON.parse(raw);if(!validData(data))throw Error('Không đúng định dạng');return data}catch(e){console.warn('Không thể tải dữ liệu',e);return seed()}}
const validData = d => d&&Array.isArray(d.tables)&&Array.isArray(d.menu)&&Array.isArray(d.orders)&&d.tables.every(t=>typeof t.id==='string'&&typeof t.name==='string'&&Number.isFinite(t.capacity))&&d.menu.every(m=>typeof m.id==='string'&&typeof m.name==='string'&&Number.isFinite(m.price))&&d.orders.every(o=>typeof o.id==='string'&&typeof o.tableId==='string'&&Array.isArray(o.items)&&['open','paid'].includes(o.status));
let state=load(),route='overview',tableFilter='all',menuFilter='Tất cả',menuQuery='',orderFilter='open',tableQuery='',orderQuery='',drawerTable=null,drawerSearch='',drawerCategory='Tất cả',returnRoute=null,editingOrderId=null;
let toastTimeout;
function persist(){localStorage.setItem(KEY,JSON.stringify(state))}
function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),2900)}
function orderAmount(o){return (o?.items||[]).reduce((sum,it)=>sum+it.qty*it.price,0)}
function openOrder(tableId){return state.orders.find(o=>o.tableId===tableId&&o.status==='open')}
function tableById(tableId){return state.tables.find(t=>t.id===tableId)}
function todayKey(date){const d=new Date(date);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateTime(date){return date?`${dateFmt.format(new Date(date))} · ${timeFmt.format(new Date(date))}`:'—'}
function paidToday(){return state.orders.filter(o=>o.status==='paid'&&todayKey(o.paidAt)===todayKey(new Date()))}
function allPaid(){return state.orders.filter(o=>o.status==='paid')}
function recentOrders(){return [...state.orders].sort((a,b)=>new Date(b.paidAt||b.createdAt)-new Date(a.paidAt||a.createdAt))}
function pageHeader(kicker,title,sub,action=''){return `<div class="page-header"><div><div class="eyebrow">${kicker}</div><h1 class="page-title">${title}</h1><p class="page-sub">${sub}</p></div>${action}</div>`}
function stat(label,value,note,icon){return `<div class="stat"><div class="stat-top"><span>${label}</span><div class="stat-icon">${icon}</div></div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`}
function blank(emoji,title,desc,action=''){return `<div class="empty"><div class="empty-emoji">${emoji}</div><h3>${title}</h3><p>${desc}</p>${action}</div>`}
function statusBadge(busy){return busy?'<span class="badge-status badge-busy">Đang phục vụ</span>':'<span class="badge-status badge-free">Bàn trống</span>'}
function render(){document.querySelectorAll('[data-route]').forEach(el=>el.classList.toggle('active',el.dataset.route===route));const titles={overview:'Tổng quan',tables:'Quản lý bàn',menu:'Thực đơn',orders:'Đơn hàng',reports:'Báo cáo'};document.getElementById('breadcrumb').textContent='Không gian làm việc / '+titles[route];document.getElementById('view').innerHTML=({overview:renderOverview,tables:renderTables,menu:renderMenu,orders:renderOrders,reports:renderReports}[route])();}
function renderOverview(){const paid=paidToday();const revenue=paid.reduce((s,o)=>s+orderAmount(o),0);const occupied=state.tables.filter(t=>openOrder(t.id)).length;const open=state.orders.filter(o=>o.status==='open');const recent=recentOrders().slice(0,5);
return pageHeader('BẢNG ĐIỀU KHIỂN','Tổng quan nhà hàng','Tất cả hoạt động nhà hàng trong một màn hình.',`<button class="btn btn-primary" data-action="quick-order">＋ Tạo đơn hàng</button>`)+
`<section class="hero"><div><h2>Vận hành nhà hàng, thật đơn giản.</h2><p>Quản lý bàn, nhận món, thanh toán và theo dõi doanh thu ngay tại quầy. Mọi thay đổi được lưu trên thiết bị của bạn.</p></div><button class="btn" data-route="tables">Xem sơ đồ bàn ↗</button></section>`+
`<section class="stats">${stat('Doanh thu hôm nay',money(revenue),`${paid.length} đơn đã thanh toán`,'💰')}${stat('Bàn đang phục vụ',occupied,`Trên tổng số ${state.tables.length} bàn`,'🍽️')}${stat('Đơn chưa thanh toán',open.length,'Các đơn đang mở','🧾')}${stat('Số món trong thực đơn',state.menu.length,`${state.menu.filter(m=>m.available).length} món đang bán`,'📖')}</section>`+
`<div class="columns"><section class="panel"><div class="panel-header"><div><h3 class="panel-title">Tình trạng bàn</h3><p class="panel-sub">Nhấn vào một bàn để bắt đầu phục vụ</p></div><button class="link-btn" data-route="tables">Tất cả bàn ↗</button></div><div class="panel-body"><div class="occupancy"><span class="tiny">${occupied}/${state.tables.length} bàn bận</span><div class="progress"><div class="progress-fill" style="width:${state.tables.length?100*occupied/state.tables.length:0}%"></div></div><strong>${state.tables.length?Math.round(100*occupied/state.tables.length):0}%</strong></div><div class="table-mini-grid">${state.tables.slice(0,12).map(t=>{const busy=!!openOrder(t.id);return `<button class="mini-table ${busy?'busy':''}" data-open-table="${esc(t.id)}"><span class="table-symbol">${busy?'🍲':'♧'}</span><strong>${esc(t.name)}</strong><small>${busy?'Đang sử dụng':'Còn trống'}</small></button>`}).join('')}</div>${state.tables.length===0?blank('🪑','Chưa có bàn','Hãy thêm bàn để quản lý phục vụ.') :''}</div></section><section class="panel"><div class="panel-header"><div><h3 class="panel-title">Hoạt động gần đây</h3><p class="panel-sub">Cập nhật theo đơn hàng</p></div><button class="link-btn" data-route="orders">Xem tất cả ↗</button></div><div class="panel-body">${recent.length?`<div class="activity">${recent.map(o=>`<div class="activity-item"><div class="activity-icon">${o.status==='paid'?'✅':'🧾'}</div><div class="activity-info"><strong>${esc(tableById(o.tableId)?.name||o.tableName||'Bàn đã xóa')} · ${o.status==='paid'?'Đã thanh toán':'Đang phục vụ'}</strong><span>${dateTime(o.paidAt||o.createdAt)}</span></div><span class="activity-amount">${money(orderAmount(o))}</span></div>`).join('')}</div>`:blank('📝','Chưa có đơn hàng','Bắt đầu từ mục Quản lý bàn để tạo đơn.')}</div></section></div>`}
function renderTables(){let arr=state.tables.filter(t=>(tableFilter==='all'||(tableFilter==='busy'?!!openOrder(t.id):!openOrder(t.id)))&&t.name.toLowerCase().includes(tableQuery.toLowerCase()));const occupied=state.tables.filter(t=>openOrder(t.id)).length;
return pageHeader('QUẢN LÝ PHỤC VỤ','Sơ đồ bàn ăn',`${state.tables.length} bàn · ${occupied} đang phục vụ · ${state.tables.length-occupied} còn trống`,`<button class="btn btn-primary" data-action="add-table">＋ Thêm bàn</button>`)+
`<div class="toolbar"><div class="filters"><button class="filter ${tableFilter==='all'?'active':''}" data-table-filter="all">Tất cả (${state.tables.length})</button><button class="filter ${tableFilter==='free'?'active':''}" data-table-filter="free">Còn trống (${state.tables.length-occupied})</button><button class="filter ${tableFilter==='busy'?'active':''}" data-table-filter="busy">Đang phục vụ (${occupied})</button></div><label class="search"><span>⌕</span><input id="tableSearch" aria-label="Tìm bàn" placeholder="Tìm theo tên bàn..." value="${esc(tableQuery)}"></label></div>`+
(arr.length?`<div class="table-grid">${arr.map(t=>{const o=openOrder(t.id);return `<article class="table-card ${o?'busy':''}"><div class="table-card-head"><div><div class="table-number">${esc(t.name)}</div><div class="table-cap">👤 Sức chứa: ${t.capacity} người</div></div><div class="table-avatar">${o?'🍲':'🪑'}</div></div>${statusBadge(!!o)}<div class="table-card-foot"><small>${o?money(orderAmount(o)):'Sẵn sàng nhận khách'}</small><button data-open-table="${esc(t.id)}">${o?'Chi tiết đơn ↗':'Gọi món ＋'}</button></div>${!o?`<button class="btn-plain tiny" style="padding:7px 0 0" data-edit-table="${esc(t.id)}">Sửa bàn</button>`:''}</article>`}).join('')}</div>`:blank('🍽️','Không có bàn phù hợp','Thử thay đổi bộ lọc hoặc thêm một bàn mới.',`<button class="btn btn-primary" data-action="add-table">Thêm bàn</button>`))}
function renderMenu(){let cats=['Tất cả','Khai vị','Món chính','Đồ uống','Tráng miệng'];const filtered=state.menu.filter(m=>(menuFilter==='Tất cả'||m.category===menuFilter)&&m.name.toLowerCase().includes(menuQuery.toLowerCase()));return pageHeader('THỰC ĐƠN','Danh sách món ăn',`Quản lý ${state.menu.length} món ăn và đồ uống, cập nhật giá bán nhanh chóng.`,`<button class="btn btn-primary" data-action="add-dish">＋ Thêm món mới</button>`)+
`<div class="toolbar"><div class="filters">${cats.map(c=>`<button class="filter ${menuFilter===c?'active':''}" data-menu-filter="${esc(c)}">${c}</button>`).join('')}</div><label class="search"><span>⌕</span><input id="menuSearch" aria-label="Tìm món" placeholder="Tìm tên món ăn..." value="${esc(menuQuery)}"></label></div>`+
(filtered.length?`<div class="menu-grid">${filtered.map(m=>`<article class="menu-card"><div class="dish-avatar">${esc(m.emoji||'🍴')}</div><div><h3 class="dish-title">${esc(m.name)}</h3><div class="dish-cat">${esc(m.category)}</div></div><div class="dish-bottom"><div><div class="dish-price">${money(m.price)}</div><div class="dish-status ${m.available?'':'off'}">${m.available?'● Đang bán':'● Tạm hết'}</div></div><div class="dish-buttons"><button class="btn btn-white btn-xs" title="Sửa món" data-edit-dish="${esc(m.id)}">Sửa</button><button class="btn btn-xs ${m.available?'btn-danger':'btn-soft'}" title="Đổi tình trạng" data-toggle-dish="${esc(m.id)}">${m.available?'Ẩn':'Bán'}</button></div></div></article>`).join('')}</div>`:blank('🥗','Không tìm thấy món','Hãy thử từ khóa hoặc danh mục khác.',`<button class="btn btn-primary" data-action="add-dish">Thêm món</button>`))}
function renderOrders(){let orders=recentOrders().filter(o=>(orderFilter==='all'||o.status===orderFilter)&&((tableById(o.tableId)?.name||o.tableName||'').toLowerCase().includes(orderQuery.toLowerCase())||o.id.toLowerCase().includes(orderQuery.toLowerCase())));const opens=state.orders.filter(o=>o.status==='open').length,paids=state.orders.filter(o=>o.status==='paid').length;
return pageHeader('GIAO DỊCH','Quản lý đơn hàng',`Theo dõi ${state.orders.length} đơn hàng từ khi gọi món đến lúc thanh toán.`,`<button class="btn btn-primary" data-action="quick-order">＋ Tạo đơn hàng</button>`)+
`<div class="toolbar"><div class="filters"><button class="filter ${orderFilter==='open'?'active':''}" data-order-filter="open">Đang mở (${opens})</button><button class="filter ${orderFilter==='paid'?'active':''}" data-order-filter="paid">Đã thanh toán (${paids})</button><button class="filter ${orderFilter==='all'?'active':''}" data-order-filter="all">Tất cả</button></div><label class="search"><span>⌕</span><input id="orderSearch" aria-label="Tìm đơn" placeholder="Tìm mã đơn hoặc bàn..." value="${esc(orderQuery)}"></label></div>`+
`<section class="panel"><div class="table-wrap">${orders.length?`<table class="data-table"><thead><tr><th>Mã đơn</th><th>Bàn</th><th>Thời gian</th><th>Trạng thái</th><th>Tổng tiền</th><th>Thao tác</th></tr></thead><tbody>${orders.map(o=>`<tr><td><strong>#${esc(o.id.split('_').pop().toUpperCase())}</strong><span class="minor">${o.items.reduce((s,it)=>s+it.qty,0)} món</span></td><td><strong>${esc(tableById(o.tableId)?.name||o.tableName||'Bàn đã xóa')}</strong></td><td>${dateTime(o.paidAt||o.createdAt)}</td><td><span class="badge-status ${o.status==='paid'?'badge-paid':'badge-busy'}">${o.status==='paid'?'Đã thanh toán':'Đang mở'}</span></td><td><strong>${money(orderAmount(o))}</strong></td><td><button class="btn btn-soft btn-xs" data-view-order="${esc(o.id)}">${o.status==='paid'?'Xem hóa đơn':'Xem đơn'}</button></td></tr>`).join('')}</tbody></table>`:blank('🧾','Chưa có đơn hàng phù hợp','Thử bộ lọc khác hoặc bắt đầu nhận đơn từ sơ đồ bàn.',`<button class="btn btn-primary" data-action="quick-order">Tạo đơn mới</button>`)}</div></section>`}
function getWeekDays(){const dates=[];const now=new Date();for(let i=6;i>=0;i--){let d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);dates.push({key:todayKey(d),label:`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`})}return dates}
function renderReports(){const paid=allPaid(),today=paidToday(),revenue=paid.reduce((s,o)=>s+orderAmount(o),0),todayRev=today.reduce((s,o)=>s+orderAmount(o),0),days=getWeekDays();const graph=days.map(d=>({...d,value:paid.filter(o=>todayKey(o.paidAt)===d.key).reduce((s,o)=>s+orderAmount(o),0)}));const max=Math.max(...graph.map(d=>d.value),1);const sold={};paid.forEach(o=>o.items.forEach(it=>{const k=it.name;sold[k]=(sold[k]||0)+it.qty}));const top=Object.entries(sold).sort((a,b)=>b[1]-a[1]).slice(0,5);
return pageHeader('PHÂN TÍCH KINH DOANH','Báo cáo doanh thu','Doanh thu được tính từ những đơn đã thanh toán.',`<button class="btn btn-white" data-action="export-data">↓ Xuất dữ liệu</button>`)+
`<div class="stats">${stat('Doanh thu hôm nay',money(todayRev),`${today.length} hóa đơn`,'💵')}${stat('Tổng doanh thu',money(revenue),'Từ khi sử dụng ứng dụng','📊')}${stat('Đơn đã hoàn thành',paid.length,'Tất cả thời gian','✅')}${stat('Giá trị đơn trung bình',money(paid.length?revenue/paid.length:0),'Tính trên hóa đơn đã thanh toán','🧮')}</div>`+
`<div class="report-grid"><section class="panel"><div class="panel-header"><div><h3 class="panel-title">Doanh thu 7 ngày gần nhất</h3><p class="panel-sub">Biểu đồ cập nhật từ dữ liệu thanh toán</p></div></div><div class="panel-body"><div class="chart">${graph.map(d=>`<div class="bar-col"><div class="bar" style="height:${Math.max(d.value/max*100,1)}%" title="${esc(d.label)}: ${money(d.value)}">${d.value?`<div class="bar-value">${shortMoney(d.value)}</div>`:''}</div><small>${d.label}</small></div>`).join('')}</div><p class="report-notice">Giá trị không bao gồm đơn chưa thanh toán. Dữ liệu chỉ được lưu trong trình duyệt này.</p></div></section><section class="panel"><div class="panel-header"><div><h3 class="panel-title">Món bán chạy</h3><p class="panel-sub">Xếp hạng theo số lượng đã bán</p></div></div><div class="panel-body">${top.length?top.map(([name,qty],i)=>`<div class="best-seller"><span class="rank">${String(i+1).padStart(2,'0')}</span><div class="grow"><strong>${esc(name)}</strong><small>Đã bán</small></div><b>${qty} phần</b></div>`).join(''):blank('🍜','Chưa có dữ liệu','Thanh toán đơn hàng đầu tiên để bắt đầu thống kê.')}</div></section></div><div class="footer-tools"><button class="btn btn-white" data-action="import-data">↑ Khôi phục JSON</button><button class="btn btn-danger" data-action="reset-data">↺ Đặt lại dữ liệu mẫu</button></div><p class="report-notice">Lưu ý: đặt lại dữ liệu sẽ xóa toàn bộ đơn hàng và các thay đổi trong trình duyệt hiện tại. Hãy xuất JSON trước khi đặt lại.</p>`}
function setRoute(next){route=next;render();window.scrollTo({top:0,behavior:'instant'})}
function showModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modalOverlay').classList.add('open');const input=document.querySelector('#modalContent input:not([type=hidden])');if(input)setTimeout(()=>input.focus(),30)}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open')}
function modalHead(title,desc){return `<div class="modal-head"><div><h2>${title}</h2><p>${desc}</p></div><button class="close" data-action="close-modal" aria-label="Đóng">×</button></div>`}
function tableModal(t){showModal(modalHead(t?'Chỉnh sửa bàn':'Thêm bàn mới',t?'Cập nhật thông tin bàn ăn.':'Đặt tên và số khách tối đa cho bàn.')+`<form id="tableForm" data-id="${esc(t?.id||'')}"><div class="form-field"><label for="tableName">Tên bàn</label><input id="tableName" name="name" maxlength="40" required placeholder="Ví dụ: Bàn 13" value="${esc(t?.name||'')}"></div><div class="form-field"><label for="tableCapacity">Sức chứa (người)</label><input id="tableCapacity" name="capacity" type="number" min="1" max="100" step="1" required value="${t?.capacity||4}"></div><div class="modal-actions">${t?'<button type="button" class="btn btn-danger" data-delete-table="'+esc(t.id)+'">Xóa bàn</button>':''}<button type="button" class="btn btn-white" data-action="close-modal">Hủy</button><button class="btn btn-primary" type="submit">Lưu bàn</button></div></form>`)}
const CATEGORIES=['Khai vị','Món chính','Đồ uống','Tráng miệng'];
function dishModal(m){showModal(modalHead(m?'Sửa món ăn':'Thêm món ăn',m?'Điều chỉnh tên, danh mục, giá hoặc biểu tượng.':'Thông tin này sẽ xuất hiện trong thực đơn gọi món.')+`<form id="dishForm" data-id="${esc(m?.id||'')}"><div class="form-field"><label for="dishName">Tên món ăn</label><input id="dishName" name="name" maxlength="80" required placeholder="Ví dụ: Phở bò" value="${esc(m?.name||'')}"></div><div class="form-row"><div class="form-field"><label for="dishCategory">Danh mục</label><select id="dishCategory" name="category">${CATEGORIES.map(c=>`<option value="${c}" ${m?.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="form-field"><label for="dishEmoji">Biểu tượng</label><input id="dishEmoji" name="emoji" maxlength="5" placeholder="🍜" value="${esc(m?.emoji||'🍴')}"></div></div><div class="form-field"><label for="dishPrice">Đơn giá (VND)</label><input id="dishPrice" name="price" type="number" min="1000" max="100000000" step="1000" required value="${m?.price||35000}"></div><div class="modal-actions">${m?`<button type="button" class="btn btn-danger" data-delete-dish="${esc(m.id)}">Xóa món</button>`:''}<button type="button" class="btn btn-white" data-action="close-modal">Hủy</button><button class="btn btn-primary" type="submit">Lưu món</button></div></form>`)}
function showPickTable(){const available=state.tables.filter(t=>!openOrder(t.id));showModal(modalHead('Chọn bàn để gọi món','Mỗi bàn chỉ có một đơn đang mở tại một thời điểm.')+`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">${available.map(t=>`<button class="btn btn-white" style="justify-content:space-between" data-choose-table="${esc(t.id)}"><span>🪑 ${esc(t.name)}</span><span class="tiny">${t.capacity} người</span></button>`).join('')}</div>${available.length?'':blank('🍽️','Không có bàn trống','Thêm bàn mới hoặc thanh toán một đơn đang mở.')}<div class="modal-actions"><button class="btn btn-white" data-action="close-modal">Đóng</button></div>`)}
function showDrawer(tableId){const t=tableById(tableId);if(!t)return notify('Không tìm thấy bàn');drawerTable=tableId;drawerSearch='';drawerCategory='Tất cả';editingOrderId=openOrder(tableId)?.id||null;closeModal();drawDrawer();document.getElementById('drawerBackdrop').classList.add('open');document.getElementById('drawer').classList.add('open');}
function closeDrawer(){drawerTable=null;editingOrderId=null;document.getElementById('drawerBackdrop').classList.remove('open');document.getElementById('drawer').classList.remove('open')}
function drawDrawer(preserveSearchFocus=false){if(!drawerTable)return;const t=tableById(drawerTable),o=openOrder(drawerTable),categories=['Tất cả',...CATEGORIES];const dishList=state.menu.filter(m=>m.available&&(drawerCategory==='Tất cả'||m.category===drawerCategory)&&m.name.toLowerCase().includes(drawerSearch.toLowerCase()));const items=o?.items||[];const total=orderAmount(o);
const content=`<div class="drawer-head"><div><h2>${esc(t?.name||'Chi tiết bàn')} <span class="badge-status ${o?'badge-busy':'badge-free'}" style="vertical-align:middle;margin-left:6px">${o?'Đang phục vụ':'Bàn trống'}</span></h2><p>${o?`Đơn được tạo lúc ${dateTime(o.createdAt)}`:'Chọn món ở bên trái để tạo đơn hàng mới'}</p></div><button class="close" data-action="close-drawer" aria-label="Đóng">×</button></div><div class="drawer-content"><div class="drawer-menu"><h3 class="drawer-section-title">🍽️ Chọn món ăn</h3><label class="search" style="width:100%"><span>⌕</span><input id="drawerSearch" placeholder="Tìm món trong thực đơn..." value="${esc(drawerSearch)}"></label><div class="filters" style="margin-top:13px">${categories.map(c=>`<button class="filter ${drawerCategory===c?'active':''}" data-drawer-category="${esc(c)}">${c}</button>`).join('')}</div><div class="drawer-menu-list">${dishList.length?dishList.map(m=>`<div class="order-food"><span class="food-emoji">${esc(m.emoji||'🍴')}</span><div class="grow"><strong>${esc(m.name)}</strong><small>${money(m.price)} · ${esc(m.category)}</small></div><button title="Thêm 1 phần" data-add-to-order="${esc(m.id)}">＋</button></div>`).join(''):blank('🥣','Không có món phù hợp','Thử bộ lọc hoặc tìm kiếm khác.')}</div></div><div class="drawer-cart"><h3 class="drawer-section-title">🧾 Chi tiết đơn hàng</h3><div class="cart-list">${items.length?items.map(it=>`<div class="cart-item"><div class="grow"><strong>${esc(it.name)}</strong><small>${money(it.price)} / phần</small><div class="qty"><button aria-label="Giảm số lượng" data-qty="${esc(it.menuId)}" data-delta="-1">−</button><span>${it.qty}</span><button aria-label="Tăng số lượng" data-qty="${esc(it.menuId)}" data-delta="1">＋</button></div></div><strong>${money(it.qty*it.price)}</strong></div>`).join(''):blank('🛒','Đơn hàng đang trống','Hãy chọn món bên trái để bắt đầu thêm vào đơn.')}</div><div class="cart-footer"><div class="summary-line"><span>Số lượng món</span><strong>${items.reduce((s,it)=>s+it.qty,0)} phần</strong></div><div class="summary-line"><span>Giảm giá / VAT</span><strong>Chưa áp dụng</strong></div><div class="grand-total"><span>Tổng thanh toán</span><strong>${money(total)}</strong></div><div class="stack">${items.length?`<button class="btn btn-primary btn-full" data-action="pay-order">✓ Thanh toán đơn hàng</button><button class="btn btn-white btn-full" data-action="close-drawer">Lưu & đóng</button><button class="btn btn-danger btn-full" data-action="cancel-order">Hủy đơn hàng</button>`:`<button class="btn btn-white btn-full" data-action="close-drawer">Đóng</button>`}</div><p class="report-notice">Mọi thay đổi được tự động lưu, không cần nhấn nút lưu.</p></div></div></div>`;
document.getElementById('drawerBody').innerHTML=content;if(preserveSearchFocus){const e=document.getElementById('drawerSearch');e.focus();e.setSelectionRange(e.value.length,e.value.length)}}
function addDishToOrder(menuId){const m=state.menu.find(x=>x.id===menuId&&x.available);if(!m||!drawerTable)return;let o=openOrder(drawerTable);if(!o){o={id:id('order'),tableId:drawerTable,tableName:tableById(drawerTable)?.name||'',items:[],status:'open',createdAt:new Date().toISOString(),paidAt:null,paymentMethod:null};state.orders.push(o)}const item=o.items.find(i=>i.menuId===m.id);if(item){if(item.qty>=99)return notify('Tối đa 99 phần cho mỗi món');item.qty++}else o.items.push({menuId:m.id,name:m.name,price:m.price,qty:1});persist();drawDrawer();render()}
function changeQty(menuId,delta){const o=openOrder(drawerTable);if(!o)return;const it=o.items.find(i=>i.menuId===menuId);if(!it)return;it.qty=Math.min(99,it.qty+delta);if(it.qty<=0)o.items=o.items.filter(i=>i!==it);if(!o.items.length)state.orders=state.orders.filter(x=>x.id!==o.id);persist();drawDrawer();render()}
function askPayment(){if(!drawerTable||!openOrder(drawerTable)?.items.length)return;const o=openOrder(drawerTable);showModal(modalHead('Xác nhận thanh toán',`Thanh toán ${money(orderAmount(o))} cho ${tableById(drawerTable)?.name||'bàn'}.`)+`<form id="paymentForm"><div class="form-field"><label for="paymentMethod">Phương thức thanh toán</label><select id="paymentMethod" name="method"><option value="cash">Tiền mặt</option><option value="bank">Chuyển khoản</option></select></div><div class="banner">Khi xác nhận, đơn được chuyển sang trạng thái đã thanh toán và bàn sẽ trở về trạng thái trống.</div><div class="modal-actions"><button class="btn btn-white" type="button" data-action="close-modal">Quay lại</button><button class="btn btn-primary" type="submit">Xác nhận ${money(orderAmount(o))}</button></div></form>`)}
function paymentName(method){return method==='bank'?'Chuyển khoản':'Tiền mặt'}
function showReceipt(o){const tableName=tableById(o.tableId)?.name||o.tableName||'Bàn';let content=modalHead('Hóa đơn thanh toán',`Đơn #${o.id.split('_').pop().toUpperCase()} · ${esc(tableName)}`)+`<div id="receiptView"><div style="text-align:center;padding:12px 0 17px"><div style="font-size:23px;font-weight:900">✦ BẾP VIỆT</div><p style="margin-top:6px">PHIẾU THANH TOÁN · ${o.status==='paid'?'ĐÃ THANH TOÁN':'CHƯA THANH TOÁN'}</p></div><div class="summary-line"><span>Bàn</span><strong>${esc(tableName)}</strong></div><div class="summary-line"><span>Thời gian</span><strong>${dateTime(o.paidAt||o.createdAt)}</strong></div><div class="divider-line"></div>${o.items.map(it=>`<div class="summary-line" style="align-items:flex-start;gap:8px"><span style="max-width:72%">${esc(it.name)} × ${it.qty}</span><strong>${money(it.qty*it.price)}</strong></div>`).join('')}<div class="divider-line"></div><div class="grand-total"><span>Tổng tiền</span><strong>${money(orderAmount(o))}</strong></div>${o.status==='paid'?`<div class="summary-line"><span>Thanh toán</span><strong>${paymentName(o.paymentMethod)}</strong></div>`:''}<p style="text-align:center;margin-top:22px;color:#7e889a">Cảm ơn quý khách và hẹn gặp lại!</p></div><div class="modal-actions"><button class="btn btn-white" data-action="close-modal">Đóng</button><button class="btn btn-primary" data-print-order="${esc(o.id)}">🖨 In hóa đơn</button></div>`;showModal(content)}
function printReceipt(orderId){const o=state.orders.find(x=>x.id===orderId);if(!o)return;const t=tableById(o.tableId)?.name||o.tableName||'Bàn';const el=document.getElementById('receiptPrintable');el.style.display='block';el.style.background='#fff';el.style.fontFamily='Arial,sans-serif';el.innerHTML=`<div style="max-width:440px;margin:auto;color:#000"><h1 style="text-align:center">✦ BẾP VIỆT</h1><p style="text-align:center">HÓA ĐƠN ${o.status==='paid'?'ĐÃ THANH TOÁN':'TẠM TÍNH'}</p><hr><p>Bàn: ${esc(t)}</p><p>Ngày: ${dateTime(o.paidAt||o.createdAt)}</p><p>Mã đơn: ${esc(o.id)}</p><hr>${o.items.map(it=>`<p style="display:flex;justify-content:space-between"><span>${esc(it.name)} × ${it.qty}</span><b>${money(it.qty*it.price)}</b></p>`).join('')}<hr><h2 style="display:flex;justify-content:space-between"><span>Tổng tiền</span><span>${money(orderAmount(o))}</span></h2><p>Thanh toán: ${paymentName(o.paymentMethod)}</p><p style="text-align:center;margin-top:40px">Cảm ơn quý khách!</p></div>`;window.print();setTimeout(()=>{el.style.display='none';el.innerHTML=''},500)}
function exportData(){const blob=new Blob([JSON.stringify({app:'BepViet POS',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='bepviet-sao-luu-'+todayKey(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Đã tạo file sao lưu JSON')}
function resetData(){if(confirm('Xóa toàn bộ dữ liệu hiện tại và khôi phục bàn, thực đơn mẫu? Hành động này không thể hoàn tác.')){state=seed();persist();closeDrawer();closeModal();tableFilter='all';menuFilter='Tất cả';orderFilter='open';render();notify('Đã khôi phục dữ liệu mẫu')}}
function handleAction(action){if(action==='quick-order')showPickTable();else if(action==='add-table')tableModal(null);else if(action==='add-dish')dishModal(null);else if(action==='close-modal')closeModal();else if(action==='close-drawer')closeDrawer();else if(action==='export-data')exportData();else if(action==='import-data')document.getElementById('importInput').click();else if(action==='reset-data')resetData();else if(action==='pay-order')askPayment();else if(action==='cancel-order'){const o=openOrder(drawerTable);if(o&&confirm('Hủy đơn hàng hiện tại? Mọi món trong đơn sẽ bị xóa.')){state.orders=state.orders.filter(x=>x.id!==o.id);persist();drawDrawer();render();notify('Đã hủy đơn hàng')}}}
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.route){setRoute(target.dataset.route);return}if(target.dataset.action){handleAction(target.dataset.action);return}if(target.dataset.tableFilter){tableFilter=target.dataset.tableFilter;render();return}if(target.dataset.menuFilter){menuFilter=target.dataset.menuFilter;render();return}if(target.dataset.orderFilter){orderFilter=target.dataset.orderFilter;render();return}if(target.dataset.openTable){showDrawer(target.dataset.openTable);return}if(target.dataset.editTable){tableModal(tableById(target.dataset.editTable));return}if(target.dataset.editDish){dishModal(state.menu.find(m=>m.id===target.dataset.editDish));return}if(target.dataset.toggleDish){const m=state.menu.find(m=>m.id===target.dataset.toggleDish);if(m){m.available=!m.available;persist();render();notify(m.available?'Đã mở bán món':'Đã tạm ngưng bán món')}return}if(target.dataset.chooseTable){showDrawer(target.dataset.chooseTable);return}if(target.dataset.drawerCategory){drawerCategory=target.dataset.drawerCategory;drawDrawer();return}if(target.dataset.addToOrder){addDishToOrder(target.dataset.addToOrder);return}if(target.dataset.qty){changeQty(target.dataset.qty,Number(target.dataset.delta));return}if(target.dataset.viewOrder){const o=state.orders.find(x=>x.id===target.dataset.viewOrder);if(o){if(o.status==='paid')showReceipt(o);else showDrawer(o.tableId)}return}if(target.dataset.printOrder){printReceipt(target.dataset.printOrder);return}
if(target.dataset.deleteTable){const t=tableById(target.dataset.deleteTable);if(openOrder(t.id))return notify('Không thể xóa bàn đang phục vụ');if(confirm(`Xóa ${t.name}? Các đơn hàng cũ vẫn được lưu.`)){state.tables=state.tables.filter(x=>x.id!==t.id);persist();closeModal();render();notify('Đã xóa bàn')}return}if(target.dataset.deleteDish){const m=state.menu.find(m=>m.id===target.dataset.deleteDish);if(confirm(`Xóa món ${m.name}? Hóa đơn cũ không bị ảnh hưởng.`)){state.menu=state.menu.filter(x=>x.id!==m.id);persist();closeModal();render();notify('Đã xóa món')}return}});
document.addEventListener('submit',e=>{const form=e.target;if(!['tableForm','dishForm','paymentForm'].includes(form.id))return;e.preventDefault();const data=new FormData(form);if(form.id==='tableForm'){const name=String(data.get('name')||'').trim(),capacity=Number(data.get('capacity'));if(!name||!Number.isInteger(capacity)||capacity<1||capacity>100)return notify('Thông tin bàn chưa hợp lệ');const oldId=form.dataset.id;if(state.tables.some(t=>t.name.toLowerCase()===name.toLowerCase()&&t.id!==oldId))return notify('Tên bàn đã tồn tại');if(oldId){const t=tableById(oldId);if(t&&openOrder(t.id))return notify('Không thể sửa bàn đang phục vụ');Object.assign(t,{name,capacity})}else state.tables.push({id:id('table'),name,capacity});persist();closeModal();render();notify('Đã lưu thông tin bàn')}else if(form.id==='dishForm'){const name=String(data.get('name')||'').trim(),category=String(data.get('category')),emoji=String(data.get('emoji')||'🍴').trim(),price=Number(data.get('price'));if(!name||!CATEGORIES.includes(category)||!Number.isFinite(price)||price<1000||price>100000000)return notify('Thông tin món ăn không hợp lệ');const m=state.menu.find(x=>x.id===form.dataset.id);if(m)Object.assign(m,{name,category,emoji,price});else state.menu.push({id:id('dish'),name,category,emoji,price,available:true});persist();closeModal();render();notify('Đã lưu món ăn')}else{const o=openOrder(drawerTable);if(!o||!o.items.length)return;const method=data.get('method');if(!['cash','bank'].includes(method))return;o.status='paid';o.paidAt=new Date().toISOString();o.paymentMethod=method;persist();closeDrawer();closeModal();render();notify('Thanh toán thành công · '+money(orderAmount(o)));showReceipt(o)}});
document.addEventListener('input',e=>{if(e.target.id==='tableSearch'){tableQuery=e.target.value;let pos=e.target.selectionStart;render();let inp=document.getElementById('tableSearch');if(inp){inp.focus();inp.setSelectionRange(pos,pos)}}else if(e.target.id==='menuSearch'){menuQuery=e.target.value;let pos=e.target.selectionStart;render();let inp=document.getElementById('menuSearch');if(inp){inp.focus();inp.setSelectionRange(pos,pos)}}else if(e.target.id==='orderSearch'){orderQuery=e.target.value;let pos=e.target.selectionStart;render();let inp=document.getElementById('orderSearch');if(inp){inp.focus();inp.setSelectionRange(pos,pos)}}else if(e.target.id==='drawerSearch'){drawerSearch=e.target.value;drawDrawer(true)}});
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target.id==='modalOverlay')closeModal()});document.getElementById('drawerBackdrop').addEventListener('click',closeDrawer);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('modalOverlay').classList.contains('open'))closeModal();else closeDrawer()}});
document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('exportTop').addEventListener('click',exportData);
document.getElementById('importInput').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>5*1024*1024)throw Error('File quá lớn (tối đa 5 MB)');const parsed=JSON.parse(await file.text());const data=parsed.data||parsed;if(!validData(data))throw Error('Định dạng dữ liệu không hợp lệ');if(!confirm('Khôi phục bản sao lưu sẽ ghi đè toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;state=data;persist();closeDrawer();closeModal();render();notify('Đã khôi phục dữ liệu thành công')}catch(err){alert('Không thể nhập file: '+err.message)}});
render();
</script>
</body>
</html>
